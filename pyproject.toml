[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gita"
version = "0.1.0"
description = "A GitHub App that reviews pull requests, onboards contributors and generates tests, with model output gated by deterministic checks."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "arq>=0.26",
    "pgvector>=0.3",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
gita = "gita.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gita.indexer.queries" = ["*.scm"]
"gita.agents.prompts" = ["*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Fixture repos contain deliberate bugs and line numbers the golden
# checklists cite; never lint or reformat them.
extend-exclude = ["tests/fixtures", "evals/pr_review/base_repo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
