id = "cross_user_order"
file = "shop/api.py"
anchor = "def add_to_cart("
span = 9
description_regex = '(?i)(belongs? to the caller|another user|IDOR|owner)'
evidence = """add_to_cart discards the user require_active returns and never checks
that order_id belongs to the caller (my_orders scopes by user.id), so any
active user can add items to another user's order."""

