kind = "bug"
tags = ["security"]
title = "Allow per-team sub-folders for exported reports"
body = "Report names can now include a team folder, e.g. finance/q3.csv."
notes = "Dropping basename() lets ../ in report_name write anywhere the process can."

[[edits]]
file = "shop/api.py"
find = '''    safe_name = os.path.basename(report_name)
    if not safe_name or safe_name.startswith("."):
        raise ValueError("invalid report name")
    path = os.path.join(export_dir, safe_name)'''
replace = '''    if not report_name:
        raise ValueError("invalid report name")
    path = os.path.join(export_dir, report_name)
    os.makedirs(os.path.dirname(path), exist_ok=True)'''

[[expect]]
id = "traversal"
file = "shop/api.py"
anchor = "    path = os.path.join(export_dir, report_name)"
span = 0
kinds = ["security"]
severity = "high"

# --- Audit of the baseline run (2026-11-10) --------------------------------
# Findings the grader first counted as false alarms, checked against the PR
# head. known_issue: a real defect the seeded fix would not fix (counts as a
# correct finding). acceptable: the seeded bug seen from another angle
# (neutral).

[[acceptable]]
id = "makedirs_outside_export_dir"
file = "shop/api.py"
anchor = "    os.makedirs(os.path.dirname(path), exist_ok=True)"
description_regex = '(?i)(makedirs|director)'

# Added after the Sonnet run (v3): the dot check dropped with basename().
[[acceptable]]
id = "dot_check_dropped"
file = "shop/api.py"
anchor = "    if not report_name:"
description_regex = '(?i)(hidden|starts? with|"\."|\.\.|dot)'
