kind = "clean"
tags = ["refactor"]
title = "Share the PBKDF2 call between hash and verify"
body = "One helper so the iteration count can't drift between the two."
notes = "Behaviour-preserving refactor; constant-time comparison kept."

[[edits]]
file = "shop/auth.py"
find = '''def hash_password(password: str, *, salt: bytes | None = None) -> str:
    salt = salt or secrets.token_bytes(16)
    digest = hashlib.pbkdf2_hmac("sha256", password.encode(), salt, _ITERATIONS)
    return f"{salt.hex()}${digest.hex()}"


def verify_password(password: str, stored: str) -> bool:
    salt_hex, digest_hex = stored.split("$", 1)
    candidate = hashlib.pbkdf2_hmac(
        "sha256", password.encode(), bytes.fromhex(salt_hex), _ITERATIONS
    )
    return hmac.compare_digest(candidate.hex(), digest_hex)'''
replace = '''def _derive(password: str, salt: bytes) -> bytes:
    return hashlib.pbkdf2_hmac("sha256", password.encode(), salt, _ITERATIONS)


def hash_password(password: str, *, salt: bytes | None = None) -> str:
    salt = salt or secrets.token_bytes(16)
    return f"{salt.hex()}${_derive(password, salt).hex()}"


def verify_password(password: str, stored: str) -> bool:
    salt_hex, digest_hex = stored.split("$", 1)
    candidate = _derive(password, bytes.fromhex(salt_hex))
    return hmac.compare_digest(candidate.hex(), digest_hex)'''
