kind = "clean"
tags = ["twin"]
title = "Add product search"
body = "Adds a name search for the storefront search box."
notes = "The correct twin of b01: parameterized, wildcards escaped."

[[edits]]
file = "shop/db.py"
append = '''


def search_products(conn: sqlite3.Connection, term: str) -> list[sqlite3.Row]:
    escaped = term.replace("\\", "\\\\").replace("%", "\\%").replace("_", "\\_")
    return conn.execute(
        "SELECT id, name, price_cents, stock FROM products "
        "WHERE name LIKE ? ESCAPE '\\' ORDER BY id",
        (f"%{escaped}%",),
    ).fetchall()
'''
