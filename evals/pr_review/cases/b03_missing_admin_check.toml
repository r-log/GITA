kind = "bug"
tags = ["security"]
title = "Add product deletion endpoint"
body = "Lets back-office staff remove discontinued products."
notes = "Every other mutating handler calls require_admin; this one doesn't."

[[edits]]
file = "shop/api.py"
append = '''


def delete_product(conn: sqlite3.Connection, user: User | None, product_id: int) -> dict:
    with db.transaction(conn):
        conn.execute("DELETE FROM products WHERE id = ?", (product_id,))
    return {"deleted": product_id}
'''

