# head. known_issue: a real defect the seeded fix would not fix (counts as a
# correct finding). acceptable: the seeded bug seen from another angle
# (neutral).

[[acceptable]]
id = "no_fail_fast"
file = "shop/config.py"
anchor = 'payment_api_key=os.environ.get("PAYMENT_API_KEY", "live_'
description_regex = '(?i)(fail[- ]fast|KeyError|missing or mis)'
