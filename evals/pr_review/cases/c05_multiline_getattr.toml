kind = "clean"
tags = ["tripwire"]
title = "Add feature flag lookup"
body = "Reads optional feature flags off the settings object."
notes = "Valid multi-line call that earlier agents misreported as a syntax error."

[[edits]]
file = "shop/config.py"
append = '''


def feature_enabled(settings: Settings, name: str, default: bool = False) -> bool:
    flags = getattr(
        settings, "feature_flags", {}
    )
    return bool(flags.get(name, default))
'''

# --- Audit of the baseline run (2026-11-10) --------------------------------
# Findings the grader first counted as false alarms, checked against the PR
# head. known_issue: a real defect the seeded fix would not fix (counts as a
# correct finding). acceptable: the seeded bug seen from another angle
# (neutral).

[[known_issue]]
id = "feature_flags_not_on_settings"
file = "shop/config.py"
anchor = 'settings, "feature_flags", {}'
description_regex = 'feature_flags'
evidence = """Settings (a frozen dataclass) has no feature_flags field and
load_settings never sets one, so getattr always returns {} and feature_enabled
always returns the default (checked). The case was meant to be clean; it still
tests that the multi-line call isn't reported as a syntax error."""
