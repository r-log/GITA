# Every finding of every review (keyed by run: the results directory), read against the case's later-fixed
# defects after the run. `describes` is the defect the finding describes
# (wherever it points), or "" for none of them. A defect counts as CAUGHT in
# a review when one of its findings describes it; LOCATED (cites a line the
# fix changed, within the tolerance) is reported separately. Findings that
# describe none of the mined defects are not judged right or wrong here:
# this backtest measures recall only.

