# Hand labels for the mined defects, written BEFORE any review was run, so
# they can't drift toward the results. One entry per later-fixed defect
# (case id + fix id from cases.json).
#
# visible  "code"    a careful reviewer could see it in the PR: the diff, the
#                    files it touches, and the declarations it calls
#          "repo"    needs code the PR doesn't show, elsewhere in the repository
#          "domain"  needs knowledge the repository doesn't hold (the game
#                    client's packet layouts, its crypto quirks, game rules)
#          "none"    not a product defect: excluded from scoring
# origin   "introduced"  the PR wrote the defective code
#          "moved"       the PR moved or rewrote code that already had it
#                        (line tracing credits the mover; a reviewer still
#                        sees the code in the diff)

[[label]]
case = "pr31"
